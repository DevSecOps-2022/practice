- name: checking given is odd or even
  hosts: local
  connection: local
  vars:
   given_number: 8
  tasks:
  - name: is even
    debug:
     msg: "given numver{{given_number}} is even"
    when: given_number % 2 == 0

  - name: is odd
    debug:
     msg: "given number {{given_number}} is odd"
    when: given_number % 2 != 0